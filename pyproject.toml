[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "diagpriv"
version = "0.2.0"
description = "Research tooling for privacy-preserving operational diagnosis benchmarks"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "DiagPriv contributors" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["diagbench*", "diagpriv*"]
