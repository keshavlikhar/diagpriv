name: Clean-room reproducibility audit

on:
  pull_request:
    paths:
      - ".github/workflows/clean_room_reproducibility.yml"
      - "docs/CLEAN_ROOM_REPRODUCIBILITY_REVIEW.md"
      - "paper/**"
      - "diagpriv/**"
      - "diagbench/**"
      - "tests/**"
      - "artifacts/**"
      - "pyproject.toml"
      - "uv.lock"

permissions:
  contents: read

jobs:
  clean-room:
    name: Fresh Ubuntu clean-room audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Confirm clean-room boundaries
        shell: bash
        run: |
          set -euo pipefail
          echo "HEAD=$(git rev-parse HEAD)"
          echo "OS=$(uname -a)"
          if [[ -n "${OPENAI_API_KEY:-}" || -n "${DIAGPRIV_HMAC_KEY_HEX:-}" ]]; then
            echo "Provider/HMAC credential unexpectedly present" >&2
            exit 1
          fi
          if find results -maxdepth 1 -type f ! -name '.gitkeep' -print -quit | grep -q .; then
            echo "Unexpected provider result artifact present in clean checkout" >&2
            exit 1
          fi
          echo "Provider credentials: absent"
          echo "Provider result JSONLs: absent"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "0.12.17"
          enable-cache: false

      - name: Environment versions
        run: |
          python --version
          uv --version

      - name: Install development dependencies
        run: uv sync --extra dev

      - name: Whitespace check
        run: git diff --check

      - name: Tracked secret scan
        run: python .github/scripts/check_tracked_secrets.py

      - name: Full pytest
        run: uv run pytest

      - name: Paper generated-assets check
        run: uv run python paper/render_tables.py --check

      - name: Byte-for-byte table regeneration
        shell: bash
        run: |
          set -euo pipefail
          cp -a paper/generated /tmp/generated-before
          uv run python paper/render_tables.py --write
          diff -ru /tmp/generated-before paper/generated
          git diff --exit-code -- paper/generated
          echo "Generated paper assets reproduced byte-for-byte"

      - name: Frozen provider artifact verifier
        shell: bash
        run: |
          set +e
          uv run python -m diagpriv.artifacts verify --all
          rc=$?
          set -e
          echo "artifact_verifier_exit_code=$rc"
          if [[ "$rc" -ne 2 ]]; then
            echo "Expected clean checkout verifier exit 2 (MISSING), got $rc" >&2
            exit 1
          fi
          echo "Artifact verifier produced expected MISSING status"

      - name: Manuscript build availability
        shell: bash
        run: |
          set -euo pipefail
          if command -v latexmk >/dev/null 2>&1; then
            echo "latexmk_available=yes"
            cd paper
            latexmk -pdf -interaction=nonstopmode -halt-on-error -outdir=build main.tex
            pdfinfo build/main.pdf | grep '^Pages:' || true
            if grep -E 'LaTeX Warning: (Citation|Reference).*undefined|There were undefined references' build/main.log; then
              echo "Undefined citation/reference warning found" >&2
              exit 1
            fi
          else
            echo "latexmk_available=no"
            echo "Manuscript build not attempted; clean runner lacks TeX, as permitted by issue #50."
          fi

      - name: Final checkout cleanliness
        run: git status --short
