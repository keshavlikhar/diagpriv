name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Python 3.12 verification
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "0.12.17"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Check whitespace
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          git diff --check
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git diff --check "origin/$BASE_REF...HEAD"
          elif git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            git diff --check "$BEFORE_SHA...$HEAD_SHA"
          else
            git diff --check HEAD^ HEAD
          fi

      - name: Scan tracked files for high-confidence secrets
        run: python .github/scripts/check_tracked_secrets.py

      - name: Install development dependencies
        run: uv sync --extra dev

      - name: Run full test suite
        run: uv run pytest
